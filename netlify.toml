[[redirects]]
  from = "/api/indexnow"
  to = "/.netlify/functions/indexnow"
  status = 200

# ── 1a · institutoexcelencia.com → su ficha en tuconsultor.com ──────────────
# El dominio del Instituto de Excelencia Europea deja de tener web propia y
# apunta a su ficha dentro del grupo.
#
# ⚠ CUIDADO CON EL CORREO. Este bloque solo afecta al tráfico HTTP que ya haya
# llegado a Netlify. El correo del dominio depende de sus registros MX, que NO
# se tocan: si al apuntar el dominio se cambian los servidores de nombres a
# Netlify sin recrear los MX, el correo deja de entrar el mismo día.
# Ver DOMINIO-INSTITUTO.md antes de tocar el DNS.
#
# 301 y no 302: es un traslado permanente y así se transfiere la autoridad de
# enlaces a la ficha del grupo.
[[redirects]]
  from = "https://institutoexcelencia.com/*"
  to = "https://www.tuconsultor.com/grupo/instituto-excelencia.html"
  status = 301
  force = true

[[redirects]]
  from = "https://www.institutoexcelencia.com/*"
  to = "https://www.tuconsultor.com/grupo/instituto-excelencia.html"
  status = 301
  force = true

[[redirects]]
  from = "http://institutoexcelencia.com/*"
  to = "https://www.tuconsultor.com/grupo/instituto-excelencia.html"
  status = 301
  force = true

[[redirects]]
  from = "http://www.institutoexcelencia.com/*"
  to = "https://www.tuconsultor.com/grupo/instituto-excelencia.html"
  status = 301
  force = true

# ── 1b · El blog vivió en Consultify: redirigir al blog de TuConsultor ──
[[redirects]]
  from = "https://consultify.tuconsultor.com/blog/*"
  to = "https://www.tuconsultor.com/blog/"
  status = 301
  force = true

# ── 2 · Subdominio Consultify: la app (SPA, sin force: los assets reales pasan) ──
[[redirects]]
  from = "https://consultify.tuconsultor.com/app/*"
  to = "/app/index.html"
  status = 200

# ── 3 · Subdominio Consultify: resto → carpeta /consultify (force: pisa la raíz) ──
[[redirects]]
  from = "https://consultify.tuconsultor.com/*"
  to = "/consultify/:splat"
  status = 200
  force = true

# ── 4 · SPA de la app también en el dominio principal ──
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/BingSiteAuth.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# ═══ TuConsultor + Consultify · UN SOLO DEPLOY ═══
# Dominios del sitio: www.tuconsultor.com (primario), tuconsultor.com,
# consultify.tuconsultor.com (alias servido por rewrites por host).

[build]
  command = "cd consultify/app && npm install && npm run build && cd ../netlify/functions && npm install && cd ../../.. && node build-dist.mjs"
  publish = "dist"
  functions = "consultify/netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_SERVICE_ROLE_KEY"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdf-lib", "pptxgenjs", "@pdf-lib/fontkit"]
  # esbuild solo empaqueta lo que puede seguir por los imports. La tipografía y
  # los logotipos del PDF se leen del disco en tiempo de ejecución, así que hay
  # que declararlos: sin esto, la función se despliega sin ellos y el documento
  # sale sin logos (o falla al no encontrar la fuente).
  included_files = [
    "consultify/netlify/functions/fuentes/**",
    "consultify/netlify/functions/marca/**"
  ]

[functions."cobros-diario"]
  schedule = "0 6 * * *"

# ── 1 · Funciones (válidas en ambos hosts; deben ir ANTES de los rewrites) ──
[[redirects]]
  from = "/api/agenda-feed"
  to = "/.netlify/functions/agenda-feed"
  status = 200

[[redirects]]
  from = "/blog/rss.xml"
  to = "/.netlify/functions/blog-rss"
  status = 200

[[redirects]]
  from = "/api/generar-oferta"
  to = "/.netlify/functions/generar-oferta"
  status = 200

[[redirects]]
  from = "/api/contacto"
  to = "/.netlify/functions/contacto"
  status = 200

[[redirects]]
  from = "/api/newsletter"
  to = "/.netlify/functions/newsletter"
  status = 200

# ── 1b · El blog vivió en Consultify: redirigir al blog de TuConsultor ──
[[redirects]]
  from = "https://consultify.tuconsultor.com/blog/*"
  to = "https://www.tuconsultor.com/blog/"
  status = 301
  force = true

# ── 2 · Subdominio Consultify: la app (SPA, sin force: los assets reales pasan) ──
[[redirects]]
  from = "https://consultify.tuconsultor.com/app/*"
  to = "/app/index.html"
  status = 200

# ── 3 · Subdominio Consultify: resto → carpeta /consultify (force: pisa la raíz) ──
[[redirects]]
  from = "https://consultify.tuconsultor.com/*"
  to = "/consultify/:splat"
  status = 200
  force = true

# ── 4 · SPA de la app también en el dominio principal ──
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 120" width="110" height="120" role="img" aria-label="Fátima Ballesteros">
  <!-- Marcador mientras no haya foto propia. Antes se enlazaba una imagen del
       WordPress antiguo que devuelve 403 y se veía el icono de imagen rota. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123F52"/>
      <stop offset="1" stop-color="#0B2E3D"/>
    </linearGradient>
  </defs>
  <rect width="110" height="120" rx="16" fill="url(#g)"/>
  <rect x="0.75" y="0.75" width="108.5" height="118.5" rx="15.25" fill="none" stroke="#1E5468" stroke-width="1.5"/>
  <text x="55" y="66" text-anchor="middle" font-family="Manrope, system-ui, sans-serif"
        font-size="34" font-weight="700" fill="#F99001" letter-spacing="1">FB</text>
  <text x="55" y="88" text-anchor="middle" font-family="Manrope, system-ui, sans-serif"
        font-size="9" font-weight="600" fill="#7FA7B4">Fátima B.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Orbita.PMTools">
  <!-- Favicon de Orbita: la esfera con el símbolo, SIN texto ni animación.
       A 16 px el texto «Orbita.PMTools» es una mancha ilegible, y una animación
       en la pestaña distrae de lo que el usuario está haciendo. -->
  <defs>
    <radialGradient id="fe" cx="32%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#1B5468"/>
      <stop offset="55%" stop-color="#103A4C"/>
      <stop offset="100%" stop-color="#0A2B3A"/>
    </radialGradient>
    <linearGradient id="fa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1FA1A6"/>
      <stop offset="58%" stop-color="#1FA1A6"/>
      <stop offset="100%" stop-color="#F99001"/>
    </linearGradient>
  </defs>

  <circle cx="150" cy="150" r="140" fill="url(#fe)"/>
  <!-- Solo el meridiano central: a tamaño pequeño las seis elipses del logotipo
       completo se convierten en ruido gris. -->
  <ellipse cx="150" cy="150" rx="140" ry="43" fill="none" stroke="#2E6879" stroke-width="2.4" opacity=".7"/>
  <circle cx="150" cy="150" r="140" fill="none" stroke="url(#fa)" stroke-width="9"/>

